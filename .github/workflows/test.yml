name: test
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 10
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest -v
      - run: python make_sample.py
      - name: Demo output must match the lesson
        run: python dupfinder.py sample > actual.txt
      - name: Compare
        shell: python
        run: |
          a = open("actual.txt", encoding="utf-8").read().replace("\r\n", "\n").strip()
          b = open("expected_output.txt", encoding="utf-8").read().strip()
          assert a == b, "output differs"
          print("Demo output matches the lesson.")
